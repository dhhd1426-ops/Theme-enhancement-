name: 构建 APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: 构建调试版 APK
        run: gradle assembleDebug --no-daemon --stacktrace

      # 每次推送发布一个新版本；文件名固定，所以
      # releases/latest/download/wallpaper-launcher.apk 永远指向最新一版
      - name: 发布到 Release
        env:
          GH_TOKEN: ${{ github.token }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          TAG="v0.1.${{ github.run_number }}"
          cp app/build/outputs/apk/debug/app-debug.apk wallpaper-launcher.apk
          gh release create "$TAG" wallpaper-launcher.apk \
            --target "${{ github.sha }}" \
            --title "壁纸桌面 $TAG" \
            --notes "测试版（调试签名）。${MSG:-手动构建}" \
            --latest
